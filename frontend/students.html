<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estudiantes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📚</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Estudiantes</h1>

        <div>
            <h2>Nuevo Estudiante</h2>
            <form id="student-form">
                <input type="hidden" id="student-id">
                <div>
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" required minlength="2" placeholder="Digite nombre">
                </div>
                <div>
                    <label for="age">Edad:</label>
                    <input type="number" id="age" name="age" required min="1" placeholder="Digite edad">
                </div>
                <div>
                    <label for="grade">Nota:</label>
                    <input type="number" id="grade" name="grade" required min="0" max="5" step="0.1" placeholder="Digite nota (0-5)">
                </div>
                <div>
                    <button type="submit" id="submit-btn">Guardar</button>
                    <button type="button" onclick="cancelEdit()">Cancelar</button>
                </div>
            </form>
        </div>

        <div>
            <h2>Lista de Estudiantes</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Edad</th>
                        <th>Nota</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="students-list">
                </tbody>
            </table>
        </div>
    </div>

        <script>
        //  guard — si no está autenticado, redirige al login
        if (sessionStorage.getItem("authenticated") !== "true") {
            window.location.href = "index.html";
        }

        // muestra el email del usuario en el header
        const savedEmail = localStorage.getItem("user-email");
        if (savedEmail) {
            document.getElementById("user-email").textContent = savedEmail;
        }

        //  cierra sesión limpiando sessionStorage y localStorage
        function logout() {
            sessionStorage.removeItem("authenticated");
            localStorage.removeItem("user-email");
            window.location.href = "index.html";
        }
    </script>

    <script src="students.js"></script>
</body>
</html>
